name: Deploy Laravel App (Docker on EC2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ==============================================================================
# Concurrency: Cancel redundant in-progress builds and deploy latest commit
# ==============================================================================
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Docker Build & Deploy on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker Containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SSH_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 20m
          envs: DB_PASSWORD,COMMIT_SHA
          script: |
            set -e

            echo "==> Deploying Dockerized Laravel App on EC2..."
            CURRENT_USER=$(whoami)

            # 1. Ensure Docker daemon is enabled and running
            sudo systemctl enable --now docker
            sudo usermod -aG docker "$CURRENT_USER" 2>/dev/null || true

            # 2. Ensure Docker Compose plugin is installed
            if ! docker compose version >/dev/null 2>&1; then
              echo "==> Installing Docker Compose plugin..."
              sudo dnf install -y docker-compose-plugin 2>/dev/null || {
                sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
                sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              }
            fi

            # 3. Create Swap file if not present (prevents OOM during build on t3.small)
            if [ ! -f /swapfile ]; then
              echo "==> Setting up 2GB Swap memory for stable Docker builds..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null || true
            fi

            # 4. Stop host Apache to release port 80 for Docker
            echo "==> Stopping host Apache to free port 80 for Docker container..."
            sudo systemctl stop httpd 2>/dev/null || true
            sudo systemctl disable httpd 2>/dev/null || true

            # 5. Sync repository code
            APP_DIR="/var/www/html/IdeaProj"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$CURRENT_USER:$CURRENT_USER" "$APP_DIR"
            git config --global --add safe.directory "*"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$APP_DIR"/* "$APP_DIR"/.[!.]* 2>/dev/null || true
              git clone https://github.com/ZainCloud009/IdeaProj.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # 6. Ensure .env exists and database credentials are configured
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            if [ -n "$DB_PASSWORD" ]; then
              if grep -q "^DB_PASSWORD=" .env; then
                sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$DB_PASSWORD|" .env
              else
                echo "DB_PASSWORD=$DB_PASSWORD" >> .env
              fi
            fi

            # 7. Build and run containers via Docker Compose
            echo "==> Building and launching Docker containers..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose build --pull
            docker compose up -d

            # 8. Wait for containers to initialize and run migrations
            echo "==> Waiting for containers to initialize..."
            sleep 12

            echo "==> Active Docker Containers:"
            docker ps --filter "name=ideaproj"

            echo "==> Verifying Health Check (HTTP port 80)..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1/up" || echo "failed")
            if [ "$STATUS" = "200" ]; then
              echo "==> [SUCCESS] Docker container is LIVE and healthy on port 80 (HTTP 200)!"
            else
              echo "==> Health check status: $STATUS. Checking main page:"
              curl -I http://127.0.0.1/ || true
            fi

            # 9. Clean up dangling images to save disk space
            docker image prune -f

            echo "==> Docker Deployment on EC2 completed successfully!"
