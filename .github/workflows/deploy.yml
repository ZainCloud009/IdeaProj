name: Deploy Laravel App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ==============================================================================
# Concurrency: If multiple developers push simultaneously, cancel older
# in-progress runs and deploy the latest commit immediately.
# ==============================================================================
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Fast Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, fileinfo
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Production Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install NPM Dependencies & Build Production Assets
        run: |
          npm install --prefer-offline --no-audit
          npm run build

      - name: Create Deployment Package
        run: |
          tar --warning=no-file-changed -czf /tmp/deploy.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.terraform' \
            --exclude='./.terraform.lock.hcl' \
            --exclude='./terraform.tfstate*' \
            --exclude='./tests' \
            --exclude='./phpunit.xml' \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Copy Deployment Package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SSH_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp"
          timeout: 30s

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SSH_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 60s
          envs: DB_PASSWORD
          script: |
            set -e

            # Project repository folder inside /var/www/html/
            APP_DIR="/var/www/html/IdeaProj"

            echo "==> Ensuring project directory exists: $APP_DIR..."
            sudo mkdir -p $APP_DIR

            echo "==> Extracting release package into $APP_DIR..."
            sudo tar -xzf /tmp/deploy.tar.gz -C $APP_DIR
            sudo rm -f /tmp/deploy.tar.gz

            cd $APP_DIR

            echo "==> Setting up environment file..."
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                sudo cp .env.example .env
                sudo php artisan key:generate --force
              fi
            fi

            # Update DB_PASSWORD in .env if provided in GitHub Secrets
            if [ -n "$DB_PASSWORD" ]; then
              sudo sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$DB_PASSWORD/" .env
            fi

            echo "==> Ensuring MariaDB service is running..."
            sudo systemctl enable --now mariadb

            echo "==> Running database migrations..."
            sudo php artisan config:clear
            sudo php artisan migrate --force

            echo "==> Creating storage link..."
            sudo php artisan storage:link || true

            echo "==> Caching configuration, routes, and views..."
            sudo php artisan config:cache
            sudo php artisan route:cache
            sudo php artisan view:cache

            echo "==> Setting directory permissions..."
            sudo chown -R ec2-user:apache $APP_DIR
            sudo chmod -R 775 $APP_DIR/storage $APP_DIR/bootstrap/cache

            echo "==> Updating Apache configuration for /var/www/html/IdeaProj/public..."
            sudo tee /etc/httpd/conf.d/laravel.conf > /dev/null << 'VHOST'
            <VirtualHost *:80>
                DocumentRoot "/var/www/html/IdeaProj/public"

                <Directory "/var/www/html/IdeaProj/public">
                    Options Indexes FollowSymLinks
                    AllowOverride All
                    Require all granted
                </Directory>

                Alias /phpmyadmin /var/www/html/phpmyadmin
                <Directory "/var/www/html/phpmyadmin">
                    Options Indexes FollowSymLinks
                    AllowOverride All
                    Require all granted
                </Directory>
            </VirtualHost>
            VHOST

            echo "==> Reloading web services..."
            sudo systemctl restart php-fpm || sudo systemctl reload php-fpm
            sudo systemctl reload httpd || sudo systemctl restart httpd

            echo "==> Deployment to $APP_DIR completed successfully!"

      - name: Verify Health Endpoint
        run: |
          TARGET_HOST="${{ secrets.EC2_HOST || secrets.SSH_HOST }}"
          echo "Checking application health endpoint at http://${TARGET_HOST}/up..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${TARGET_HOST}/up" || echo "failed")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Deployment verified: Health check passed successfully!"
          else
            echo "Health check returned $STATUS. Please verify server security group port 80 and Apache configuration."
          fi
