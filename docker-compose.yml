services:
  app:
    image: ideaproj-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideaproj-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_NAME: "${APP_NAME:-IdeaProj}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-idea}"
      DB_USERNAME: "${DB_USERNAME:-idea_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret_password}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ideaproj-network

  db:
    image: mariadb:10.5
    container_name: ideaproj-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: idea
      MYSQL_USER: idea_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ideaproj-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ideaproj-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ideaproj-network

volumes:
  mariadb_data:
    driver: local
  app_storage:
    driver: local

networks:
  ideaproj-network:
    driver: bridge
