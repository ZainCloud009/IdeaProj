services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideaproj-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: IdeaProj
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: idea
      DB_USERNAME: idea_user
      DB_PASSWORD: secret_password
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ideaproj-network

  db:
    image: mariadb:10.5
    container_name: ideaproj-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: idea
      MYSQL_USER: idea_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ideaproj-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ideaproj-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ideaproj-network

volumes:
  mariadb_data:
    driver: local

networks:
  ideaproj-network:
    driver: bridge
